{% extends 'base.html' %}

{% block title %}Login | Smart Candidate Screening{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Sign in</h1>
      <p>Recruitment workspace access</p>
    </div>

    {% if error %}<div class="alert error" role="alert">{{ error }}</div>{% endif %}

    <form method="POST" action="/login" class="auth-form" autocomplete="on">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <button type="submit" class="primary-btn">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
