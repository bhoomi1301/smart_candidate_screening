services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-screening}
      POSTGRES_USER: ${POSTGRES_USER:-screening}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - screening-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-screening} -d ${POSTGRES_DB:-screening}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  screening-postgres:
